# Menu policy for AUTH_MODE=ldap.
# A menu is shown only when the authenticated directory user belongs to one of
# the configured groups. Full LDAP DNs are supported; matching is case-insensitive.
menus:
  - id: dashboard
    label: Dashboard
    path: /dashboard
    groups:
      - domain admins

  - id: csv-report-generator
    label: CSV Report Generator
    path: /reports/csv
    groups:
      - enterprise admins

  - id: audit-log-report
    label: Audit Log Report
    path: /reports/audit-log
    groups:
      - test123

  - id: payroll-report
    label: Payroll Report
    path: /reports/payroll
    groups:
      - domain admins
